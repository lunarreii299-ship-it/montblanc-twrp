name: Build TWRP for SM-W2014

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "TWRP minimal-manifest branch (twrp-6.0 or twrp-5.1)"
        default: "twrp-6.0"

env:
  MAX_RECOVERY_BYTES: 13631488   # recovery partition size from /proc/partitions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Build recoveryimage in Ubuntu 18.04 container
        run: |
          mkdir -p out
          cat > build.sh <<'BUILD'
          set -ex
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python openjdk-8-jdk bc rsync \
            lzop ca-certificates ccache python3 zopfli cpio
          git config --global user.name "ci"; git config --global user.email "ci@example.com"
          git config --global color.ui false
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod +x /usr/local/bin/repo
          mkdir -p /twrp && cd /twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b "$BRANCH"
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          mkdir -p device/samsung/montblanc3gctc
          cp -r /src/. device/samsung/montblanc3gctc/
          rm -rf device/samsung/montblanc3gctc/.git device/samsung/montblanc3gctc/.github
          export ALLOW_MISSING_DEPENDENCIES=true LC_ALL=C
          . build/envsetup.sh
          lunch omni_montblanc3gctc-eng
          set +e
          make -j"$(nproc)" recoveryimage
          set -e
          P=out/target/product/montblanc3gctc
          D=device/samsung/montblanc3gctc
          MKB=out/host/linux-x86/bin
          echo "=== biggest files in recovery ramdisk ==="
          (cd $P/recovery/root && du -ab . | sort -rn | head -40)
          MKIMG() { # $1=ramdisk.gz  $2=output.img
            $MKB/mkbootimg --kernel $D/kernel --ramdisk "$1" --dt $D/dt.img \
              --base 0x00000000 --pagesize 2048 --kernel_offset 0x00008000 \
              --ramdisk_offset 0x02000000 --tags_offset 0x01e00000 \
              --cmdline "${3:-console=null androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x3F}" -o "$2"
          }
          needed_by() { # list ELF files that need library $1
            for f in $(find "$2" -type f); do
              readelf -d "$f" 2>/dev/null | grep -q "NEEDED.*\[$1\]" && echo "$f"
            done
            return 0
          }
          # --- full ---
          $MKB/mkbootfs $P/recovery/root > /tmp/rd.cpio
          zopfli --i15 -c /tmp/rd.cpio > /tmp/rd.gz
          MKIMG /tmp/rd.gz /out/recovery_gz.img
          # --- slim: drop terminfo, non-English languages, zoneinfo ---
          rm -rf /tmp/slim && cp -a $P/recovery/root /tmp/slim
          rm -rf /tmp/slim/sbin/etc/terminfo /tmp/slim/system/usr/share/zoneinfo
          find /tmp/slim/twres/languages -type f ! -name 'en.xml' -delete || true
          $MKB/mkbootfs /tmp/slim > /tmp/slim.cpio
          zopfli --i15 -c /tmp/slim.cpio > /tmp/slim.gz
          MKIMG /tmp/slim.gz /out/recovery_slim_gz.img
          # --- tiny: slim minus bash, healthd, e2fsck, and libssh/libssl if unused ---
          rm -rf /tmp/tiny && cp -a /tmp/slim /tmp/tiny
          rm -f /tmp/tiny/sbin/bash /tmp/tiny/sbin/healthd /tmp/tiny/sbin/e2fsck
          for lib in libssh.so libssl.so; do
            users=$(needed_by $lib /tmp/tiny)
            echo "users of $lib: [$users]"
            [ -z "$users" ] && rm -f /tmp/tiny/sbin/$lib
          done
          $MKB/mkbootfs /tmp/tiny > /tmp/tiny.cpio
          zopfli --i15 -c /tmp/tiny.cpio > /tmp/tiny.gz
          MKIMG /tmp/tiny.gz /out/recovery_tiny_gz.img
          # --- SELinux workarounds (kernel only knows policy v26; TWRP 6.0 builds a newer one) ---
          python3 -c "import struct,sys;b=open(sys.argv[1],'rb').read();l=struct.unpack('<I',b[4:8])[0];print(sys.argv[1],'policy version',struct.unpack('<I',b[8+l:12+l])[0])" /tmp/tiny/sepolicy
          python3 -c "import struct,sys;b=open(sys.argv[1],'rb').read();l=struct.unpack('<I',b[4:8])[0];print(sys.argv[1],'policy version',struct.unpack('<I',b[8+l:12+l])[0])" $D/stock_sepolicy
          BASE="console=null androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x3F"
          rm -rf /tmp/sel && cp -a /tmp/tiny /tmp/sel && cp $D/stock_sepolicy /tmp/sel/sepolicy
          $MKB/mkbootfs /tmp/sel > /tmp/sel.cpio
          zopfli --i15 -c /tmp/sel.cpio > /tmp/sel.gz
          MKIMG /tmp/sel.gz /out/recovery_sela_gz.img "$BASE selinux=0 androidboot.selinux=permissive"
          MKIMG /tmp/sel.gz /out/recovery_selb_gz.img "$BASE androidboot.selinux=permissive"
          # ===== DIAGNOSTIC 1: dump what TWRP's ramdisk looks like =====
          echo "=== TWRP root top level ==="; ls -la /tmp/tiny | head -50
          echo "=== TWRP symlinks ==="; find /tmp/tiny -type l -exec ls -l {} + | head -60
          echo "=== recovery ELF interpreter ==="; readelf -l /tmp/tiny/sbin/recovery | grep -i interp || true
          echo "=== TWRP init.rc ==="; cat /tmp/tiny/init.rc
          echo "=== TWRP other rc files ==="; ls /tmp/tiny/*.rc
          # ===== DIAGNOSTIC 2: stock ramdisk through OUR packaging chain =====
          MKIMG $D/stock_ramdisk.gz /out/recovery_stock_gz.img
          gzip -dc $D/stock_ramdisk.gz > /tmp/stock.cpio
          zopfli --i15 -c /tmp/stock.cpio > /tmp/stock_zop.gz
          MKIMG /tmp/stock_zop.gz /out/recovery_stock_zop.img
          # ===== HYBRID: stock (4.3) init + policy + init.rc, TWRP binaries/resources =====
          ST=/tmp/stockrd; rm -rf $ST; mkdir -p $ST
          (cd $ST && gzip -dc /src/stock_ramdisk.gz | cpio -id --no-absolute-filenames)
          H=/tmp/hyb; rm -rf $H; cp -a $ST $H
          cp -a /tmp/sel/twres $H/
          cp -a /tmp/sel/sbin/. $H/sbin/
          rm -f $H/sbin/ueventd; cp -a $ST/sbin/ueventd $H/sbin/ueventd
          mkdir -p $H/system && cp -a /tmp/sel/system/. $H/system/
          [ -e $H/system/bin/linker ] || { mkdir -p $H/system/bin; ln -s /sbin/linker $H/system/bin/linker; }
          # make shells spawned by adbd find the libs even without LD_LIBRARY_PATH
          mkdir -p $H/system/bin
          [ -e $H/system/lib ] || ln -s /sbin $H/system/lib
          [ -e $H/system/bin/sh ] || ln -s /sbin/sh $H/system/bin/sh
          ls -l $H/system $H/system/bin | head -20
          cp -a /tmp/sel/etc/. $H/etc/ || true
          # slim: drop stock recovery UI images and other leftovers, use TWRP's res
          rm -rf $H/res && cp -a /tmp/sel/res $H/res
          rm -f $H/charger $H/initlogo.rle $H/fstab.goldfish $H/ueventd.goldfish.rc $H/init.qcom.factory.sh
          rm -f $H/sbin/cbd $H/sbin/ffu $H/sbin/security_boot_check $H/sbin/watchdogd
          du -sh $H $H/sbin $H/twres $H/res || true
          sed -i 's|^\( *export PATH .*\)$|\1\n    export LD_LIBRARY_PATH .:/sbin|' $H/init.rc
          sed -i 's/^ro.debuggable=0/ro.debuggable=1/; s/^ro.secure=1/ro.secure=0/; s/^ro.adb.secure=1/ro.adb.secure=0/' $H/default.prop
          grep -n 'secure\|debuggable' $H/default.prop || true
          # ===== make sure every shared library the binaries NEED is really in /sbin =====
          rm -f $H/sbin/nano $H/sbin/libssh.so $H/sbin/libssl.so
          STRIP=$(find /twrp/prebuilts -name 'arm-linux-androideabi-strip' -type f 2>/dev/null | head -1)
          echo "STRIP tool: [$STRIP]"
          for pass in 1 2 3; do
            for f in $(find $H/sbin -maxdepth 1 -type f); do
              for lib in $(readelf -d "$f" 2>/dev/null | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p'); do
                if [ ! -e "$H/sbin/$lib" ]; then
                  src=$(find $P/system/lib $P/obj/lib $P/symbols/system/lib -name "$lib" -type f 2>/dev/null | head -1)
                  echo "MISSING LIB: $lib (needed by $f) -> source: [$src]"
                  if [ -n "$src" ]; then
                    cp "$src" "$H/sbin/$lib"
                    [ -n "$STRIP" ] && "$STRIP" --strip-unneeded "$H/sbin/$lib" || true
                  fi
                fi
              done
            done
          done
          echo "=== library check after fixing ==="
          for f in $(find $H/sbin -maxdepth 1 -type f); do
            for lib in $(readelf -d "$f" 2>/dev/null | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p'); do
              [ -e "$H/sbin/$lib" ] || echo "STILL MISSING: $lib (needed by $f)"
            done
          done
          readelf -d $H/sbin/recovery | grep NEEDED
          ls -l $H/sbin/libcrypto.so || true
          # ===== static busybox (needs no libc.so) so adb shell works; plus a self-writing diag report =====
          if curl -fsSL -o /tmp/busybox_static https://busybox.net/downloads/binaries/1.31.0-defconfig-multiarch-musl/busybox-armv7l \
             && [ "$(stat -c %s /tmp/busybox_static)" -gt 500000 ]; then
            file /tmp/busybox_static || true
            cp /tmp/busybox_static $H/sbin/busybox && chmod 755 $H/sbin/busybox
            echo "STATIC BUSYBOX INSTALLED"
          else
            echo "WARNING: could not download static busybox"
          fi
          cat > $H/sbin/diag.sh <<'DIAG'
          #!/sbin/busybox sh
          export PATH=/sbin:/system/bin
          for i in 1 2 3 4; do
            sleep 12
            {
              echo "=== diag $i $(date)"
              echo "--- ps"; ps
              echo "--- env of recovery/adbd"
              for p in $(pidof recovery adbd); do echo "pid $p"; tr '\0' '\n' < /proc/$p/environ | head -30; done
              echo "--- dmesg tail"; dmesg | tail -n 150
              echo "--- ls /tmp"; ls -l /tmp
              echo "--- recovery.log"; cat /tmp/recovery.log
              echo "--- libs"; ls -l /sbin/libc.so /sbin/linker /system /system/bin /system/lib
              echo "--- fb"; ls -l /dev/graphics /dev/fb0; cat /sys/class/graphics/fb0/modes /sys/class/graphics/fb0/bits_per_pixel /sys/class/graphics/fb0/virtual_size
              if [ "$i" = 2 ]; then echo "--- manual recovery run"; LD_LIBRARY_PATH=/sbin timeout 6 /sbin/recovery 2>&1 | head -60; fi
            } > /tmp/diag_$i.txt 2>&1
          done
          DIAG
          chmod 755 $H/sbin/diag.sh
          printf '\nservice diag /sbin/busybox sh /sbin/diag.sh\n    oneshot\n' >> $H/init.rc
          # let TWRP's reboot/shutdown requests actually reach the kernel (the 4.3 init handles this builtin)
          printf '\non property:sys.powerctl=*\n    powerctl ${sys.powerctl}\n' >> $H/init.rc
          echo "=== hybrid init.rc ==="; cat $H/init.rc
          $MKB/mkbootfs $H > /tmp/hyb.cpio
          zopfli --i15 -c /tmp/hyb.cpio > /tmp/hyb.gz
          MKIMG /tmp/hyb.gz /out/recovery_hyb_gz.img "$BASE androidboot.selinux=permissive"
          ls -l /tmp/*.cpio /tmp/*.gz /out
          BUILD
          docker run --rm -e BRANCH="${{ inputs.branch }}" -v "$PWD":/src -v "$PWD/out":/out \
            ubuntu:18.04 bash /src/build.sh

      - name: Add Samsung footer, check size, make Odin packages
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          cd out
          for v in hyb_gz; do
            [ -f recovery_$v.img ] || continue
            echo -n SEANDROIDENFORCE >> recovery_$v.img
            SIZE=$(stat -c %s recovery_$v.img)
            echo "recovery_$v.img = $SIZE bytes (limit $MAX_RECOVERY_BYTES)"
            if [ "$SIZE" -le "$MAX_RECOVERY_BYTES" ]; then
              echo "FITS: recovery_$v.img"
              mkdir -p pkg_$v && cp recovery_$v.img pkg_$v/recovery.img
              (cd pkg_$v && tar -H ustar -c recovery.img > ../TWRP_W2014_$v.tar)
            else
              echo "TOO BIG: recovery_$v.img, do NOT flash"
              rm -f recovery_$v.img
            fi
          done
          ls -l
          ls TWRP_W2014_*.tar || { echo "::error::No image fits the 13 MB recovery partition."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: twrp-sm-w2014
          path: out/TWRP_W2014_*.tar
          compression-level: 0
