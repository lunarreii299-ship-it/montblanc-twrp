name: Build TWRP for SM-W2014

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "TWRP minimal-manifest branch (twrp-6.0 or twrp-5.1)"
        default: "twrp-6.0"

env:
  MAX_RECOVERY_BYTES: 13631488   # recovery partition size from /proc/partitions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Build recoveryimage in Ubuntu 18.04 container
        run: |
          mkdir -p out
          cat > build.sh <<'BUILD'
          set -ex
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python openjdk-8-jdk bc rsync \
            lzop ca-certificates ccache python3 zopfli
          git config --global user.name "ci"; git config --global user.email "ci@example.com"
          git config --global color.ui false
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          chmod +x /usr/local/bin/repo
          mkdir -p /twrp && cd /twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b "$BRANCH"
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
          mkdir -p device/samsung/montblanc3gctc
          cp -r /src/. device/samsung/montblanc3gctc/
          rm -rf device/samsung/montblanc3gctc/.git device/samsung/montblanc3gctc/.github
          export ALLOW_MISSING_DEPENDENCIES=true LC_ALL=C
          . build/envsetup.sh
          lunch omni_montblanc3gctc-eng
          set +e
          make -j"$(nproc)" recoveryimage
          set -e
          P=out/target/product/montblanc3gctc
          D=device/samsung/montblanc3gctc
          MKB=out/host/linux-x86/bin
          echo "=== biggest files in recovery ramdisk ==="
          (cd $P/recovery/root && du -ab . | sort -rn | head -40)
          MKIMG() { # $1=ramdisk.gz  $2=output.img
            $MKB/mkbootimg --kernel $D/kernel --ramdisk "$1" --dt $D/dt.img \
              --base 0x00000000 --pagesize 2048 --kernel_offset 0x00008000 \
              --ramdisk_offset 0x02000000 --tags_offset 0x01e00000 \
              --cmdline "console=null androidboot.hardware=qcom user_debug=31 msm_rtb.filter=0x3F" -o "$2"
          }
          needed_by() { # list ELF files that need library $1
            for f in $(find "$2" -type f); do
              readelf -d "$f" 2>/dev/null | grep -q "NEEDED.*\[$1\]" && echo "$f"
            done
            return 0
          }
          # --- full ---
          $MKB/mkbootfs $P/recovery/root > /tmp/rd.cpio
          zopfli --i15 -c /tmp/rd.cpio > /tmp/rd.gz
          MKIMG /tmp/rd.gz /out/recovery_gz.img
          # --- slim: drop terminfo, non-English languages, zoneinfo ---
          rm -rf /tmp/slim && cp -a $P/recovery/root /tmp/slim
          rm -rf /tmp/slim/sbin/etc/terminfo /tmp/slim/system/usr/share/zoneinfo
          find /tmp/slim/twres/languages -type f ! -name 'en.xml' -delete || true
          $MKB/mkbootfs /tmp/slim > /tmp/slim.cpio
          zopfli --i15 -c /tmp/slim.cpio > /tmp/slim.gz
          MKIMG /tmp/slim.gz /out/recovery_slim_gz.img
          # --- tiny: slim minus bash, healthd, e2fsck, and libssh/libssl if unused ---
          rm -rf /tmp/tiny && cp -a /tmp/slim /tmp/tiny
          rm -f /tmp/tiny/sbin/bash /tmp/tiny/sbin/healthd /tmp/tiny/sbin/e2fsck
          for lib in libssh.so libssl.so; do
            users=$(needed_by $lib /tmp/tiny)
            echo "users of $lib: [$users]"
            [ -z "$users" ] && rm -f /tmp/tiny/sbin/$lib
          done
          $MKB/mkbootfs /tmp/tiny > /tmp/tiny.cpio
          zopfli --i15 -c /tmp/tiny.cpio > /tmp/tiny.gz
          MKIMG /tmp/tiny.gz /out/recovery_tiny_gz.img
          ls -l /tmp/*.cpio /tmp/*.gz /out
          BUILD
          docker run --rm -e BRANCH="${{ inputs.branch }}" -v "$PWD":/src -v "$PWD/out":/out \
            ubuntu:18.04 bash /src/build.sh

      - name: Add Samsung footer, check size, make Odin packages
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          cd out
          for v in gz slim_gz tiny_gz; do
            [ -f recovery_$v.img ] || continue
            echo -n SEANDROIDENFORCE >> recovery_$v.img
            SIZE=$(stat -c %s recovery_$v.img)
            echo "recovery_$v.img = $SIZE bytes (limit $MAX_RECOVERY_BYTES)"
            if [ "$SIZE" -le "$MAX_RECOVERY_BYTES" ]; then
              echo "FITS: recovery_$v.img"
              mkdir -p pkg_$v && cp recovery_$v.img pkg_$v/recovery.img
              (cd pkg_$v && tar -H ustar -c recovery.img > ../TWRP_W2014_$v.tar \
                && cd .. && md5sum -t TWRP_W2014_$v.tar >> TWRP_W2014_$v.tar \
                && mv TWRP_W2014_$v.tar TWRP_W2014_$v.tar.md5)
            else
              echo "TOO BIG: recovery_$v.img, do NOT flash"
              rm -f recovery_$v.img
            fi
          done
          ls -l
          ls TWRP_W2014_*.tar.md5 || { echo "::error::No image fits the 13 MB recovery partition."; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: twrp-sm-w2014
          path: |
            out/recovery_*.img
            out/TWRP_W2014_*.tar.md5
